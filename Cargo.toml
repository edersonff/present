[package]
name = "present"
version = "0.1.0"
edition = "2021"
description = "decision-surfacing layer for agent-assisted choices"
license = "MIT"

[[bin]]
name = "present"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
